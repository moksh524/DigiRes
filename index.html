const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const upiLink = (upi, name, amt, note) => `upi://pay?pa=${String(upi).trim()}&pn=${encodeURIComponent(name)}&am=${Number(amt).toFixed(2)}&cu=INR&tn=${encodeURIComponent(note || 'DigiRes Bill')}`;

document.addEventListener('focusout', () => setTimeout(() => { if (need && !typingNow()) { need = false; render(); } }, 60));

function tok() {
  if (MODE === 'kitchen') return localStorage.getItem('digires_k_' + OWNER_ID) || (AUTH && AUTH.role === 'owner' && AUTH.id === OWNER_ID ? AUTH.token : '');
  return AUTH ? AUTH.token : '';
}
async function api(url, { body } = {}) {
  const r = await fetch(url, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'x-token': tok() }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(j.error || 'Request failed (' + r.status + ')'); e.status = r.status; throw e; }
  return j;
}
const act = body => api('/api/state', { body });
const run = async f => { try { return await f(); } catch (e) { toast(e.message, 'err'); } };
const refresh = () => poll(true);
function toast(m, k = 'ok') {
  const el = document.createElement('div');
  el.className = 'px-4 py-2 rounded-lg text-sm shadow-lg text-white max-w-[90vw] ' + (k === 'err' ? 'bg-red-600' : k === 'warn' ? 'bg-amber-600' : 'bg-[#0f6b30]');
  el.textContent = m; $('toast').appendChild(el); setTimeout(() => el.remove(), 3800);
}
function setAuth(j) { AUTH = { token: j.token, role: j.role, id: j.id }; localStorage.setItem('digires_auth', JSON.stringify(AUTH)); }
function logout(silent) {
  AUTH = null; localStorage.removeItem('digires_auth'); view = 'home'; S = {}; LAST = ''; closeModal();
  if (!silent) toast('Logged out'); poll(true);
}
function go(v) { view = v; render(); }

async function poll(force) {
  try {
    let u = '/api/state';
    if (MODE === 'customer') u += `?owner=${encodeURIComponent(OWNER_ID)}&bill=${encodeURIComponent(CB() || '')}`;
    const j = await api(u), s = JSON.stringify(j);
    ready = true;
    if (s !== LAST || force) { LAST = s; S = j; afterState(); force ? render() : softRender(); }
  } catch (e) {
    if (e.status === 401 && AUTH && MODE === 'main') logout(true);
    else if (MODE === 'customer' && e.status === 404) { S = { invalid: true }; ready = true; render(); }
    else if (!ready) { S = { err: e.message }; ready = true; render(); }
  }
}
function render() {
  if (!ready) { $('app').innerHTML = '<div class="p-10 text-center text-gray-500">Loading…</div>'; return; }
  const y = window.scrollY;
  $('app').innerHTML = MODE === 'customer' ? vCustomer() : MODE === 'kitchen' ? vKitchen() : vMain();
  drawQRs(); window.scrollTo(0, y);
}
function drawQRs(root = document) {
  if (typeof QRCode === 'undefined') { root.querySelectorAll('[data-qr]').forEach(el => { el.innerHTML = '<div class="text-xs text-red-600 text-center">QR library load nahi hui. Internet / adblock check karke page refresh karo.</div>'; }); return; }
  root.querySelectorAll('[data-qr]').forEach(el => {
    el.innerHTML = ''; const s = +el.dataset.size || 120;
    new QRCode(el, { text: el.dataset.qr, width: s, height: s, correctLevel: QRCode.CorrectLevel.M });
  });
}
function qrDataUrl(text, size = 300) {
  const d = document.createElement('div');
  new QRCode(d, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  return d.querySelector('canvas').toDataURL('image/png');
}
let SUBPOLL = null;
function modal(html, wide) {

  drawQRs($('modal'));
}
function closeModal() { clearInterval(SUBPOLL); $('modal').innerHTML = ''; }

/* ================= printing (58mm, ESC/POS over Web Bluetooth) ================= */
const BT = { dev: null, chr: null };
const BT_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '0000ff00-0000-1000-8000-00805f9b34fb', '0000fee7-0000-1000-8000-00805f9b34fb'];
async function btPair() {
  if (!navigator.bluetooth) return toast('Bluetooth printing needs Chrome/Edge over HTTPS', 'err');
  try {
    const d = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_SERVICES });
    const srv = await d.gatt.connect(); let ch = null;
    for (const s of await srv.getPrimaryServices()) {
      const cs = await s.getCharacteristics(); ch = cs.find(c => c.properties.write || c.properties.writeWithoutResponse);
      if (ch) break;
    }
    if (!ch) throw new Error('No writable printer channel found on this device');
    BT.dev = d; BT.chr = ch;
    d.addEventListener('gattserverdisconnected', () => { BT.chr = null; toast('Printer disconnected', 'warn'); render(); });
    toast('Printer paired: ' + (d.name || 'Bluetooth printer')); render();
  } catch (e) { toast(e.message || 'Pairing cancelled', 'err'); }
}
async function btSend(bytes) {
  if (!BT.chr) throw new Error('Printer not paired');
  const wr = BT.chr.properties.writeWithoutResponse ? c => BT.chr.writeValueWithoutResponse(c) : c => BT.chr.writeValue(c);
  for (let i = 0; i < bytes.length; i += 100) { await wr(bytes.slice(i, i + 100)); await new Promise(r => setTimeout(r, 30)); }
}
const encT = new TextEncoder();
function escpos(lines) {
  const out = [0x1b, 0x40];
  for (const l of lines) {
    out.push(0x1b, 0x61, l.c ? 1 : 0, 0x1b, 0x45, l.b ? 1 : 0, 0x1d, 0x21, l.big ? 0x11 : 0);
    out.push(...encT.encode(String(l.t).replace(/[^\x20-\x7e]/g, '?') + '\n'));
  }
  out.push(0x1d, 0x21, 0, 0x0a, 0x0a, 0x0a, 0x1d, 0x56, 0x00);
  return new Uint8Array(out);
}
function printDoc(html) {
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d = f.contentWindow.document; d.open(); d.write(html); d.close();
  setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 4000); }, 400);
}
function printHtml58(lines) {
  printDoc(`<html><head><style>@page{size:58mm auto;margin:0}body{width:58mm;margin:0;padding:2mm;font:12px/1.25 monospace}pre{margin:0;white-space:pre-wrap;font:inherit}.c{text-align:center}.b{font-weight:bold}.big{font-size:16px}</style></head><body>${lines.map(l => `<pre class="${l.c ? 'c ' : ''}${l.b ? 'b ' : ''}${l.big ? 'big' : ''}">${esc(l.t) || '&nbsp;'}</pre>`).join('')}</body></html>`);
}
async function printLines(lines) {
  if (BT.chr) { try { await btSend(escpos(lines)); return; } catch (e) { toast('Bluetooth print failed, using browser print', 'warn'); } }
  printHtml58(lines);
}
const dash = '-'.repeat(32);
function kotLines(o, b, bt) {
  const L = [{ t: 'KITCHEN ORDER', c: 1, b: 1, big: 1 }, { t: o.restaurant, c: 1 }, { t: 'Table ' + b.table, c: 1, b: 1, big: 1 }, { t: new Date(bt.ts).toLocaleString('en-IN'), c: 1 }, { t: dash }];
  bt.items.forEach(i => L.push({ t: `${i.qty} x ${i.name} (${i.size})`, b: 1 }));
  L.push({ t: dash }); return L;
}
function rcpLines(o, b) {
  const r = (a, c) => a.slice(0, 31 - c.length).padEnd(32 - c.length) + c;
  const L = [{ t: o.restaurant, c: 1, b: 1, big: 1 }, { t: 'Table ' + b.table, c: 1 }, { t: new Date(b.paidAt || Date.now()).toLocaleString('en-IN'), c: 1 }, { t: dash }];
  b.items.forEach(i => { L.push({ t: `${i.name} (${i.size})` }); L.push({ t: r(`  ${i.qty} x ${i.price}`, (i.qty * i.price).toFixed(2)) }); });
  L.push({ t: dash }, { t: r('Subtotal', b.subtotal.toFixed(2)) }, { t: r(`GST ${b.gstPct}%`, b.gst.toFixed(2)) }, { t: r('TOTAL', b.total.toFixed(2)), b: 1 },
    { t: `${b.status} ${b.method ? 'via ' + b.method : ''}`, c: 1 }, { t: 'Thank you! Visit again', c: 1 });
  return L;
}

/* ================= WhatsApp ================= */
function waText(o, b, code) {
  const L = [`*${o.restaurant}*`, `Table: ${b.table}` + (code ? `   Code: ${code}` : ''), '--------------------------'];
  b.items.forEach(i => L.push(`• ${i.name} (${i.size}) x${i.qty} — ${money(i.price * i.qty)}`));
  L.push('--------------------------', `Subtotal: ${money(b.subtotal)}`, `GST (${b.gstPct}%): ${money(b.gst)}`, `*Grand Total: ${money(b.total)}*`,
    `Payment: ${b.status}${b.method ? ' (' + b.method + ')' : ''}`, '', 'Thank you! Powered by DigiRes');
  return L.join('\n');
}
function waOpen(o, b, code, phone) {
  let p = String(phone || '').replace(/\D/g, ''); if (p.length === 10) p = '91' + p;
  window.open(`https://wa.me/${p}?text=${encodeURIComponent(waText(o, b, code))}`, '_blank');
}

/* ================= Razorpay ================= */
function loadRzp() {
  return new Promise((ok, no) => {
    if (window.Razorpay) return ok();
    const s = document.createElement('script'); s.src = 'https://checkout.razorpay.com/v1/checkout.js';
    s.onload = ok; s.onerror = () => no(new Error('Could not load Razorpay checkout')); document.head.appendChild(s);
  });
}
async function payRazor(body, { name, desc, onSuccess }) {
  try {
    await loadRzp();
    const o = await api('/api/create-razorpay-order', { body });
    const rz = new Razorpay({
      key: o.keyId, amount: o.amount, currency: 'INR', order_id: o.orderId, name, description: desc, theme: { color: '#0f6b30' },
      handler: async r => { try { onSuccess(await api('/api/verify-razorpay-payment', { body: r })); } catch (e) { toast(e.message, 'err'); } },
      modal: { ondismiss: () => toast('Payment cancelled – bill remains UNPAID', 'warn') }
    });
    rz.on('payment.failed', () => toast('Payment failed – bill remains UNPAID', 'err'));
    rz.open();
  } catch (e) { toast(e.message, 'err'); }
}

const featName = { qr: 'QR & Code Ordering', kds: 'Kitchen Display', whatsapp: 'WhatsApp Bill', printer: 'Auto Thermal Printer' };
function vHome() {
  const plans = S.plans || [];
  return `<section class="rounded-3xl bg-gradient-to-br from-[#0f6b30] to-[#0a4d22] text-white p-8 md:p-14 text-center">

  <section class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-8">${[['📱', 'Permanent table QRs', 'Print once. Only the session code changes for each seating.'], ['🍳', 'Live kitchen display', 'Orders print on 58mm thermal and show Preparing / Ready.'], ['🧾', 'One combined bill', 'Repeat orders merge. GST set per restaurant.'], ['💬', 'WhatsApp bill', 'Send the full itemised bill after payment.']].map(([i, t, d]) => `<div class="card p-5"><div class="text-3xl">${i}</div><div class="font-bold mt-2">${t}</div><div class="text-sm text-gray-600 mt-1">${d}</div></div>`).join('')}</section>

/* ---- sign-up payment flow ---- */
let PEND = null;
const planOf = id => (S.plans || []).find(p => p.id === id) || { name: '', price: 0 };
const startSignup = () => run(async () => {
  const v = id => $(id).value.trim();
  const planId = $('sPlan').value;
  const j = await api('/api/signup/start', { body: { restaurant: v('sName'), email: v('sEmail'), password: $('sPass').value, pin: v('sPin'), planId } });
  PEND = { id: j.pendingId, planId, email: v('sEmail') }; payModal();
});
function payModal() {
  const pl = planOf(PEND.planId), pay = S.pay || {}, upiOk = validUpi(pay.upi);
  modal(`<h2 class="text-xl font-extrabold text-[#0f6b30]">Pay subscription</h2><div class="rounded-xl bg-[#e7f4ec] p-3 my-3 text-sm">${esc(pl.name)} plan – <b>${money(pl.price)}</b> / month</div>
  <button class="btn btn-g w-full mb-1" ${pay.razorpay ? '' : 'disabled'} onclick="subRazor()">Pay with Razorpay (cards, UPI, netbanking)</button>${pay.razorpay ? '' : '<p class="text-xs text-gray-500 mb-2">Razorpay is not set up by the admin yet.</p>'}
  <button class="btn btn-a w-full mt-2" ${upiOk ? '' : 'disabled'} onclick="subUpi()">Pay via UPI QR</button>${upiOk ? '' : '<p class="text-xs text-gray-500 mt-1">Admin UPI is not set up yet.</p>'}
  ${S.testMode ? '<button class="btn btn-o w-full mt-3" onclick="subTest()">🧪 Test payment (demo, no real money)</button>' : ''}<p class="text-xs text-gray-500 mt-3">Your account is created and unlocked only after payment is confirmed.</p>` + supportLine('mt-3'));
}
const subTest = () => run(async () => {
  const v = await api('/api/test/pay-signup', { body: { pendingId: PEND.id } });
  setAuth(v); closeModal(); view = 'panel'; tab = 'tables'; await refresh(); toast('Test account created');
});
const subRazor = () => payRazor({ type: 'subscription', pendingId: PEND.id }, {
  name: 'DigiRes', desc: planOf(PEND.planId).name + ' subscription',
  onSuccess: v => { setAuth(v); closeModal(); view = 'panel'; tab = 'tables'; refresh(); toast('Payment verified. Welcome to DigiRes!'); }
});
function subUpi() {
  const pl = planOf(PEND.planId), link = upiLink(S.pay.upi, 'DigiRes', pl.price, 'DigiRes ' + pl.name);
  modal(`<h2 class="text-xl font-extrabold text-[#0f6b30]">Pay ${money(pl.price)} by UPI</h2><div class="flex justify-center my-3" data-qr="${esc(link)}" data-size="200"></div>
  <a class="btn btn-o w-full mb-2" href="${esc(link)}">Open UPI app</a>
  <input id="utr" class="inp mb-2 text-center tracking-widest" inputmode="numeric" maxlength="12" placeholder="12-digit UTR / Transaction ID"><button class="btn btn-g w-full" onclick="claimUpi()">Verify payment</button>
  <p class="text-xs text-gray-500 mt-2">UTR match hote hi account turant ban jata hai. Match na ho to admin confirm karega.</p>`);
}
const claimUpi = () => run(async () => {
  const j = await api('/api/signup/claim-upi', { body: { pendingId: PEND.id, utr: $('utr').value } });
  if (j.matched && j.token) { setAuth(j); closeModal(); view = 'panel'; tab = 'tables'; await refresh(); toast('Payment verified. Welcome to DigiRes!'); return; }
  modal(`<h2 class="text-xl font-extrabold text-[#0f6b30]">Waiting for confirmation</h2><p class="text-sm mt-2">We sent your payment details to the admin. Keep this window open or log in later with <b>${esc(PEND.email)}</b> once approved.</p><div class="mt-4 h-1 bg-gray-200 rounded overflow-hidden"><div class="h-1 w-1/3 bg-[#f59e0b] animate-pulse"></div></div>` + supportLine('mt-4'));
  SUBPOLL = setInterval(async () => {
    try {
      const { status } = await api('/api/signup/status?id=' + PEND.id);
      if (status === 'approved') { clearInterval(SUBPOLL); modal(`<h2 class="text-xl font-extrabold text-[#0f6b30]">Payment confirmed ✓</h2><p class="text-sm mt-2">Your account is ready.</p><button class="btn btn-g w-full mt-4" onclick="openLogin('login')">Log in</button>`); }
      if (status === 'rejected') { clearInterval(SUBPOLL); modal(`<h2 class="text-xl font-extrabold text-red-600">Payment not confirmed</h2><p class="text-sm mt-2">The admin could not confirm this payment. Please contact support.</p>` + supportLine('mt-3')); }
    } catch (e) {}
  }, 3000);
});

/* ================= owner dashboard ================= */

  const tabs = [['tables', 'Tables & QR'], ['orders', 'Live Orders'], ['billing', 'Billing'], ['menu', 'Menu'], ['settings', 'Settings']];
  const unpaid = S.bills.filter(b => b.status === 'UNPAID').length;
  return `<div class="flex items-center justify-between flex-wrap gap-2 mb-4"><h1 class="text-2xl font-extrabold text-[#0f6b30]">${esc(o.restaurant)}</h1>${supportLine()}</div>
  <div class="flex gap-1 overflow-x-auto mb-5">${tabs.map(([k, l]) => `<button class="px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap ${tab === k ? 'bg-[#0f6b30] text-white' : 'bg-white border'}" onclick="tab='${k}';render()">${l}${k === 'orders' && unpaid ? ` <span class="badge bg-[#f59e0b] text-black">${unpaid}</span>` : ''}</button>`).join('')}</div>

const setCode = (n, rand) => run(async () => {

function printAllQR() { let h = ''; for (let n = 1; n <= S.owner.tables; n++) h += stickerHtml(n, qrDataUrl(tUrl(n))); printDoc(`<html><body style="margin:0">${h}</body></html>`); }

const razorBill = id => payRazor({ type: 'bill', owner: S.owner.id, billId: id }, { name: S.owner.restaurant, desc: 'Counter payment', onSuccess: () => { toast('Payment verified ✓'); afterPaid(id); } });

/* ================= kitchen display ================= */
const PRINTED = new Set();
async function afterState() {
  if (MODE !== 'kitchen' || !S.owner || !S.owner.features.printer || !BT.chr || !S.bills) return;
  for (const b of S.bills) for (const bt of b.batches || []) {
    if (bt.printed || PRINTED.has(bt.id)) continue;
    PRINTED.add(bt.id);
    try {
      await btSend(escpos(kotLines(S.owner, b, bt)));
      await act({ action: 'kotPrinted', billId: b.id, batchId: bt.id });
      await act({ action: 'printLog', table: b.table, type: 'KOT' });
    } catch (e) { PRINTED.delete(bt.id); toast('KOT print failed: ' + e.message, 'err'); return; }
  }
}
function gate(title, msg) { return `<div class="max-w-md mx-auto mt-16 card p-8 text-center"><div class="text-4xl">🍳</div><h1 class="text-xl font-extrabold text-[#0f6b30] mt-2">${title}</h1><p class="text-gray-600 mt-2 text-sm">${msg}</p>${supportLine('mt-4')}</div>`; }
function vKitchen() {
  const o = S.owner;
  if (!o) return gate('Kitchen Display', 'Kitchen link ya QR Owner Dashboard → Tables & QR tab se kholo.');
  if (o.status !== 'live') return gate('Subscription stopped', 'This restaurant\'s DigiRes subscription is stopped.');
  if (!o.features.kds) return gate('Kitchen Display not enabled', 'Kitchen Display is not part of this restaurant\'s plan.');
  const list = (S.bills || []).filter(b => b.status === 'UNPAID').sort((a, b) => a.createdAt - b.createdAt);
  return `<header class="bg-[#0f6b30] text-white"><div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap"><div class="text-xl font-extrabold">Digi<span class="text-[#f59e0b]">Res</span> Kitchen</div><div class="font-semibold">${esc(o.restaurant)}</div>

  <button class="btn btn-g w-full" onclick="saveAdmin()">Save payment settings</button></div>
  <div class="card p-4 space-y-2"><h2 class="font-bold">Change password / Recovery PIN</h2><input id="cpCur" data-draft type="password" class="inp" placeholder="Current password" value="${esc(D('cpCur'))}"><input id="cpNew" data-draft type="password" class="inp" placeholder="New password (8+ chars, optional)" value="${esc(D('cpNew'))}"><input id="cpPin" data-draft class="inp" inputmode="numeric" placeholder="New Recovery PIN (4-8 digits, optional)" value="${esc(D('cpPin'))}"><button class="btn btn-g w-full" onclick="changeAdmin()">Update</button></div></div>
  <div class="mt-4">${utrCard('admin', a.feedKey, S.credits || [])}</div><h2 class="font-bold mt-6 mb-2">UPI payments awaiting confirmation</h2>${S.pending.length ? `<div class="space-y-2">${S.pending.map(p => `<div class="card p-3 flex flex-wrap items-center gap-2 justify-between"><div class="text-sm"><b>${esc(p.restaurant)}</b> · ${esc(p.email)}<br><span class="text-gray-500">${esc(S.plans.find(x => x.id === p.planId)?.name || 'Plan')} · ${money(S.plans.find(x => x.id === p.planId)?.price)} · UTR <b>${esc(p.utr)}</b></span></div><div class="flex gap-2"><button class="btn btn-g" onclick="confirmSignup('${p.id}')">Payment received – create account</button><button class="btn btn-o" onclick="rejectSignup('${p.id}')">Reject</button></div></div>`).join('')}</div>` : '<div class="card p-4 text-sm text-gray-500">Nothing waiting.</div>'}
  <h2 class="font-bold mt-6 mb-2">Live payments feed (kept 7 days)</h2>${S.payments.length ? `<div class="card divide-y">${S.payments.map(p => `<div class="p-3 text-sm flex flex-wrap justify-between gap-2"><span><b>${esc(p.restaurant)}</b> · ${esc(p.planName || '')}</span><span>${money(p.amount)} · ${esc(p.method)} · ${new Date(p.ts).toLocaleString('en-IN')}</span></div>`).join('')}</div>` : '<div class="card p-4 text-sm text-gray-500">No payments yet.</div>'}`;
}
const saveAdmin = () => run(async () => {
  await act({ action: 'adminSettings', upi: D('adUpi', S.admin.upi), razorKeyId: D('adKey', S.admin.razorKeyId), razorKeySecret: D('adSec') });
  ['adUpi', 'adKey', 'adSec'].forEach(k => delete DRAFT[k]); toast('Payment settings saved'); await refresh();
});
const changeAdmin = () => run(async () => {
  const j = await act({ action: 'adminPassword', current: D('cpCur'), newPassword: D('cpNew'), newPin: D('cpPin') });
  ['cpCur', 'cpNew', 'cpPin'].forEach(k => delete DRAFT[k]);
  if (j.relogin) { toast('Password changed. Please log in again.'); logout(true); } else { toast('Updated'); await refresh(); }
});
const confirmSignup = id => run(async () => { await act({ action: 'confirmSignup', id }); toast('Owner account created'); await refresh(); });
const rejectSignup = id => run(async () => { await act({ action: 'rejectSignup', id }); await refresh(); });

/* ================= boot ================= */
(async function init() {
  if (MODE === 'kitchen' && P.get('key')) {
    try { const j = await api('/api/auth/kitchen', { body: { owner: OWNER_ID, key: P.get('key') } }); localStorage.setItem('digires_k_' + OWNER_ID, j.token); } catch (e) { toast(e.message, 'err'); }
  }
  await poll(true); setInterval(() => poll(false), 3000);
})();
</script>
</body>
</html>
